name: Build Polyphone for Linux x64

# AppImage built in Debian 12, the oldest system supported (packaging/linux/build_appimage.sh), then started on several
# distributions with nothing but what a desktop has (packaging/linux/check_appimage.sh): the release waits for both.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: '0.0.0'
        type: string

jobs:
  build-linux-x64:
    environment: production
    runs-on: ubuntu-24.04
    container: debian:12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the AppImage
        run: bash packaging/linux/build_appimage.sh "${{ inputs.tag }}"

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyphone-linux-x64-appimage
          path: Polyphone*.AppImage
          retention-days: 7
          if-no-files-found: error

  check-linux-x64:
    name: Start on ${{ matrix.image }}
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            optional: false
          - image: ubuntu:24.04
            optional: false
          - image: fedora:latest
            optional: false
          - image: archlinux:latest
            optional: false
          # glibc 2.35, one version before Debian 12: reported, without stopping the release
          - image: ubuntu:22.04
            optional: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the AppImage
        uses: actions/download-artifact@v8
        with:
          name: polyphone-linux-x64-appimage

      - name: Start the AppImage
        run: bash packaging/linux/check_appimage.sh Polyphone*.AppImage
