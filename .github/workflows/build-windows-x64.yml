name: Build Polyphone for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SIGNPATH_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: '0.0.0'
        type: string
      
env:
  QT_VERSION: '6.6.2'
  
jobs:
  build-windows-x64:
    environment: production
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set the version
        run: python packaging/set_version.py "${{ inputs.tag }}"

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw

      - name: Install MSYS2 and required libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libsndfile

      - name: Configure with CMake
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$(cygpath -u "$QT_ROOT_DIR/bin"):$PATH"
          cmake -S sources -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")" \
            -DPOLYPHONE_OFFICIAL_BUILD=ON

      - name: Build Polyphone
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$(cygpath -u "$QT_ROOT_DIR/bin"):$PATH"
          cmake --build build --parallel $(nproc)

      - name: Prepare deployment with windeployqt
        # Plugins left out, never loaded by Polyphone (issue #405):
        # - generic (qtuiotouchplugin): TUIO touch events received from the network, only with "-plugin TuioTouch";
        # - networkinformation (qnetworklistmanager): only for QNetworkInformation, not used;
        # - tls/qopensslbackend: Qt 6.6 only loads libssl-3-x64.dll and libcrypto-3-x64.dll (OpenSSL 3), not deployed
        #   (polyphone.exe links libcrypto 4, no libssl). Left there, it would take an OpenSSL 3 found in System32 or
        #   PATH; without it, HTTPS always goes through Schannel, the TLS of Windows;
        # - tls/qcertonlybackend: certificates without TLS, only when no other backend is available.
        # Image formats are all kept: SVG in the forms and the style sheets, any image in the repository descriptions.
        shell: cmd
        run: |
          mkdir deploy
          copy build\bin\polyphone.exe deploy\
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            --release ^
            --no-translations ^
            --no-system-d3d-compiler ^
            --no-opengl-sw ^
            --skip-plugin-types generic,networkinformation ^
            --exclude-plugins qopensslbackend,qcertonlybackend ^
            deploy\polyphone.exe
          if errorlevel 1 exit /b 1
          if not exist deploy\tls\qschannelbackend.dll (
            echo ::error::tls\qschannelbackend.dll is not deployed: no HTTPS for the repository
            exit /b 1
          )

      - name: Copy the libraries of MSYS2
        # The libraries of MSYS2 imported by a file of deploy (read in its import table), then the ones they import, until
        # nothing is added. No name is written here: they change with the packages of MSYS2 (zlib 1.4 links libz-1.dll
        # instead of zlib1.dll and OpenSSL 4 is libcrypto-4-x64.dll, both missing in 2.7.3, issue #405). The runtime of
        # GCC, which built polyphone.exe, replaces the older one that windeployqt copied from the MinGW of Qt.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          MINGW_BIN=/mingw64/bin
          imports() {
            find deploy -type f \( -iname '*.exe' -o -iname '*.dll' \) -exec objdump -p {} + |
              awk '/DLL Name:/ {print $3}' | sort -fu
          }
          cp "$MINGW_BIN"/libgcc_s_seh-1.dll "$MINGW_BIN"/libstdc++-6.dll "$MINGW_BIN"/libwinpthread-1.dll deploy/
          while true; do
            added=0
            for dll in $(imports); do
              if [ ! -e "deploy/$dll" ] && [ -e "$MINGW_BIN/$dll" ]; then
                cp "$MINGW_BIN/$dll" deploy/
                echo "Copied $dll"
                added=1
              fi
            done
            if [ "$added" -eq 0 ]; then
              break
            fi
          done

      - name: Check the libraries
        # Every library imported by a file of deploy is in deploy, or comes with Windows. One that MSYS2 or Qt has but
        # deploy does not stops the build; one found nowhere is reported (a DLL of Windows unknown to this server).
        shell: msys2 {0}
        run: |
          set -euo pipefail
          QT_BIN=$(cygpath -u "$QT_ROOT_DIR/bin")
          SYSTEM_DIR=$(cygpath -u -S)
          missing=()
          for dll in $(find deploy -type f \( -iname '*.exe' -o -iname '*.dll' \) -exec objdump -p {} + |
                       awk '/DLL Name:/ {print $3}' | sort -fu); do
            if [ -e "deploy/$dll" ]; then
              continue
            fi
            if [ -e "/mingw64/bin/$dll" ] || [ -e "$QT_BIN/$dll" ]; then
              missing+=("$dll")
            elif [[ "${dll,,}" != api-ms-win-* && "${dll,,}" != ext-ms-* && ! -e "$SYSTEM_DIR/$dll" ]]; then
              echo "::warning::$dll is imported but neither in deploy nor in $SYSTEM_DIR"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Libraries imported but not in deploy: ${missing[*]}"
            exit 1
          fi
          echo "Libraries in deploy:"
          ls deploy/*.dll

      - name: Check that Media Foundation is not imported
        # The N editions of Windows have no Media Foundation without the Media Feature Pack: RtAudio loads it at run
        # time, only to convert a sample rate (sources/lib/_option_rtaudio/README.md). Fails if an update brings back
        # the import of MFPlat.DLL, with which Polyphone would not start there.
        shell: bash
        run: python packaging/windows/pe_imports.py --forbid '^mfplat\.dll$' $(find deploy -type f \( -iname '*.exe' -o -iname '*.dll' \))

      - name: Check that the program starts
        # polyphone.exe --version from deploy alone: no folder of MSYS2, Qt or Git in PATH (Git for Windows has its own
        # libcrypto and zlib) and no QT_PLUGIN_PATH, so that a library missing or of another version stops it here.
        # Windows Server has no Media Foundation, as the N editions of Windows: Polyphone must start without it.
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          # A library not found ends the process with an error code instead of showing a dialog box
          Add-Type -Namespace Win32 -Name ErrorMode -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);'
          [Win32.ErrorMode]::SetErrorMode(0x8003) | Out-Null
          $process = Start-Process -FilePath (Resolve-Path deploy\polyphone.exe).Path -ArgumentList '--version' -NoNewWindow -PassThru
          $null = $process.Handle # Needed to read the exit code afterwards
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "polyphone.exe --version did not end within 60 s"
          }
          if ($process.ExitCode -ne 0) {
            throw ("polyphone.exe --version failed with the code 0x{0:X8} (0xC0000135: library not found, 0xC0000139: function not found in a library)" -f $process.ExitCode)
          }

      - name: Copy installer resources
        shell: cmd
        run: |
          copy LICENSE.txt deploy\license.txt 2>nul || echo "No license file"
          copy packaging\windows\polyphone.ico deploy\ 2>nul || echo "No icon file"

      - name: Create portable archive
        shell: pwsh
        run: |
          $portableName = "Polyphone_${{ inputs.tag }}-windows_x64-portable"
          Compress-Archive -Path deploy\* -DestinationPath "$portableName.zip" -CompressionLevel Optimal
          Write-Host "Created portable archive: $portableName.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

          # Version and location of Inno Setup, read from its uninstall registry key
          $keys = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup [0-9]*_is1",
                  "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup [0-9]*_is1"
          $innoSetup = Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue | Sort-Object PSChildName | Select-Object -Last 1
          if (-not $innoSetup) {
            throw "Inno Setup installation not found"
          }
          $innoSetupDir = $innoSetup.InstallLocation.TrimEnd("\")
          Write-Host "Inno Setup $($innoSetup.DisplayVersion) found in $innoSetupDir"
          "INNO_SETUP_VERSION=$($innoSetup.DisplayVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INNO_SETUP_DIR=$innoSetupDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Inno Setup extra translations
        shell: pwsh
        run: |
          # Translations missing from the installation, taken from the sources of the same version if available
          $tag = "is-" + $env:INNO_SETUP_VERSION.Replace(".", "_")
          foreach ($language in "ChineseSimplified", "SerbianCyrillic") {
            $destination = "$env:INNO_SETUP_DIR\Languages\$language.isl"
            if (Test-Path $destination) {
              Write-Host "$language.isl is already an official translation"
              continue
            }
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/$tag/Files/Languages/Unofficial/$language.isl"
            try {
              Invoke-WebRequest -Uri $url -OutFile $destination
              Write-Host "$language.isl downloaded successfully"
            } catch {
              Remove-Item -Path $destination -ErrorAction SilentlyContinue
              Write-Host "::warning::$language.isl not found for Inno Setup $env:INNO_SETUP_VERSION, the language is skipped"
            }
          }

      - name: Create installer
        shell: pwsh
        run: |
          & "$env:INNO_SETUP_DIR\ISCC.exe" /DMyAppVersion=${{ inputs.tag }} /DSourceDir=../../deploy packaging/windows/polyphone.iss

      - name: Upload installer artifact
        id: upload-installer-artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyphone-windows-x64-installer
          path: packaging/windows/*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload portable artifact
        id: upload-portable-artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyphone-windows-x64-portable
          path: polyphone_*-portable.zip
          retention-days: 7
          if-no-files-found: error
          
      - name: Sign the installer artifact
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: polyphone
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          wait-for-completion: true
          github-artifact-id: '${{ steps.upload-installer-artifact.outputs.artifact-id }}'
          output-artifact-directory: 'signed'
          
      - name: Sign the portable artifact
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: polyphone
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-portable
          wait-for-completion: true
          github-artifact-id: '${{ steps.upload-portable-artifact.outputs.artifact-id }}'
          output-artifact-directory: 'signed'

      - name: Upload the signed installer as an artifact
        uses: actions/upload-artifact@v7
        with:
          path: "signed/*.exe"
          name: polyphone-windows-x64-installer-signed
          if-no-files-found: error

      - name: Upload the signed archive as an artifact
        uses: actions/upload-artifact@v7
        with:
          path: "signed/*.zip"
          name: polyphone-windows-x64-portable-signed
          if-no-files-found: error
