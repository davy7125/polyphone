name: Build Polyphone for Linux aarch64

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: '0.0.0'
        type: string
      
jobs:
  build-linux-aarch64:
    environment: production
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set the version
        run: python packaging/set_version.py "${{ inputs.tag }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libasound2-dev \
            libjack-jackd2-dev \
            libsndfile1-dev \
            libogg-dev \
            libvorbis-dev \
            libflac-dev \
            zlib1g-dev \
            libssl-dev \
            librtaudio-dev \
            librtmidi-dev \
            ca-certificates
            
      - name: Configure with CMake
        run: |
          cmake -S sources -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DPOLYPHONE_LOCAL_RTAUDIO=ON \
            -DPOLYPHONE_OFFICIAL_BUILD=ON

      - name: Build Polyphone
        run: cmake --build build --parallel $(nproc)

      - name: Create AppImage
        env:
          OUTPUT: Polyphone_${{ inputs.tag }}-linux_aarch64.AppImage
        run: |
          # Install linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy*.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/etc
          mkdir -p AppDir/etc/ssl
          
          cp build/bin/polyphone AppDir/usr/bin/
          cp packaging/io.polyphone.polyphone.desktop AppDir/usr/share/applications/
          cp sources/resources/polyphone.png AppDir/usr/share/icons/hicolor/512x512/apps/
          
          # SSL
          cp /usr/lib/aarch64-linux-gnu/libssl.so.3 AppDir/usr/lib/
          cp /usr/lib/aarch64-linux-gnu/libcrypto.so.3 AppDir/usr/lib/
          cp -r /etc/ssl/certs AppDir/etc/ssl/
          cp /etc/ssl/openssl.cnf AppDir/etc/ssl/ || true
          
          # Generate the AppImage
          ./linuxdeploy-aarch64.AppImage --appdir AppDir --plugin qt --output appimage

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyphone-linux-aarch64-appimage
          path: Polyphone*.AppImage
          retention-days: 7
          if-no-files-found: error
